name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies (core + api + dev)
        run: uv sync --all-extras

      - name: Tests + coverage
        run: uv run pytest --cov=stunassure --cov-report=term-missing --cov-fail-under=90

      - name: Lint (ruff)
        run: uv run ruff check src tests

      - name: Type-check (mypy, strict)
        run: uv run mypy
