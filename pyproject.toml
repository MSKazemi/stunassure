[project]
name = "stunassure"
version = "0.1.0"
description = "StunAssure verification core — prove fish were rendered insensible and stayed insensible until death (simulate → verify → certify → report). Zero-runtime-dependency, fail-safe."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary — Responsible Systems Lab" }
authors = [{ name = "Responsible Systems Lab" }]
keywords = ["fish-welfare", "humane-slaughter", "verification", "acceptance-sampling", "aiot"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
]
# Zero runtime dependencies by design — pure stdlib, so it runs anywhere (the
# "works on the poorest vessel" ethos). The verification logic must not need the cloud.
dependencies = []

[project.optional-dependencies]
# Optional HTTP service tier. Keeps the core dependency-free; install only where you serve an API.
api = [
    "fastapi>=0.128",
    "uvicorn[standard]>=0.38",
]

[project.scripts]
stunassure = "stunassure.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-cov>=6.2",
    "ruff>=0.14",
    "mypy>=1.18",
    # for exercising the API layer in tests
    "fastapi>=0.128",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stunassure"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/stunassure"]
